# Builds YAGUI for Windows, Linux and macOS and publishes a GitHub release.
#
# Runs when a version tag is pushed (e.g. `git tag -a v1.0.0 -m "YAGUI 1.0.0" && git push origin v1.0.0`)
# or by hand (Actions > Release > Run workflow):
#   - on a tag v*: the same as pushing the tag, the release is built and published;
#   - on a branch: only builds and tests; the files are kept as artifacts for 3 days if the
#     account's artifact storage has room (a full storage does not fail the run).
#
# A release needs no artifact storage (release files do not count against it):
#   1. prepare  checks that the tag matches the version in Cargo.toml, takes the notes for that
#               version from CHANGELOG.md and creates the release as a draft (or updates the draft).
#   2. build    builds, tests and packages on each system and uploads the files to the draft.
#   3. publish  checks that all files are there, adds SHA256SUMS.txt and publishes the release.
# If a build fails, the release stays a draft (only visible to the owner) and nothing is published.
# "Re-run failed jobs" continues from there as long as the tag still points to the same commit;
# after moving the tag, start a new run instead (actions/checkout refuses a moved tag).
# A published release is never changed: prepare, the uploads and publish stop with an error.
# To build a published version again, tag a new version (or delete its release first).
#
# Release files (the in-app updater looks for these names):
#   YAGUI-Setup-<v>-windows-x64.exe   installer (the program installs itself; uninstall via Settings > Apps)
#   yagui-<v>-windows-x64.exe         portable program / update file
#   yagui_<v>_amd64.deb               Debian/Ubuntu package
#   yagui-<v>-linux-x64.tar.gz        program for any Linux (run `./yagui --install`)
#   YAGUI-<v>-macos-universal.dmg     app for Apple silicon and Intel Macs
#   yagui-<v>-macos-universal.tar.gz  update file for macOS
#   SHA256SUMS.txt                    checksums

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The repository for `gh`. The token is only given to the steps that talk to GitHub, so build
  # scripts and tests never see it.
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Draft release with notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Download"
            echo "- **Windows:** \`YAGUI-Setup-$VERSION-windows-x64.exe\` installs YAGUI (uninstall via Settings > Apps). \`yagui-$VERSION-windows-x64.exe\` runs without installing."
            echo "- **macOS:** \`YAGUI-$VERSION-macos-universal.dmg\`, drag YAGUI into Applications (or start it right from the disk image or any other folder). The app is not notarized: macOS blocks the first start; then click \"Open Anyway\" in System Settings > Privacy & Security within about an hour and confirm with your login password (macOS 14 and older: right-click > Open)."
            echo "- **Linux:** \`yagui_${VERSION}_amd64.deb\` (Debian/Ubuntu) or \`yagui-$VERSION-linux-x64.tar.gz\` (run \`./yagui --install\`)."
            echo
            echo "Git must be installed (on macOS Apple's Command Line Tools, \`xcode-select --install\`, or Git from Homebrew; on Linux also curl, which the update check uses; the .deb brings both). YAGUI checks for updates once a day (Help > Check for Updates)."
          } >> notes.md
          # none | true (draft) | false (published); an API error stops the step instead of
          # being taken for "no release" (that would create a second draft for the tag).
          state() {
            gh api graphql \
              -f query='query($o:String!,$n:String!,$t:String!){repository(owner:$o,name:$n){release(tagName:$t){isDraft}}}' \
              -f o="${GH_REPO%/*}" -f n="${GH_REPO#*/}" -f t="$GITHUB_REF_NAME" \
              --jq '.data.repository.release | if . == null then "none" else (.isDraft | tostring) end'
          }
          s=$(state)
          case "$s" in
            none)
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "YAGUI $GITHUB_REF_NAME" --notes-file notes.md
              for i in 1 2 3; do
                s=$(state)
                if [ "$s" = true ]; then break; fi
                sleep 5
              done
              if [ "$s" != true ]; then echo "::error::The new draft is not found under $GITHUB_REF_NAME ($s)"; exit 1; fi
              ;;
            true)
              gh release edit "$GITHUB_REF_NAME" --title "YAGUI $GITHUB_REF_NAME" --notes-file notes.md
              ;;
            false)
              echo "::error::Release $GITHUB_REF_NAME is already published and is not changed. Tag a new version (or delete the release first)."
              exit 1
              ;;
            *)
              echo "::error::Unexpected answer from GitHub: $s"; exit 1
              ;;
          esac

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-24.04
          - os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust
        # Pinned to a commit: an action can read the job's token, and @stable is a moving branch.
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branch stable, 2026-11-21
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Test
        if: runner.os == 'Windows'
        run: cargo test --release --locked

      - name: Build
        if: runner.os == 'Windows'
        run: cargo build --release --locked

      - name: Test and build (Linux, in Ubuntu 22.04 for glibc 2.35)
        if: runner.os == 'Linux'
        run: |
          # Built against Ubuntu 22.04's glibc so the program and the .deb also work on Ubuntu
          # 22.04 and Debian 12. On the newer runner itself, Rust's std would tie the program to
          # glibc 2.39 (weak pidfd functions), and the .deb would then require libc6 (>= 2.39).
          docker run --rm -v "$PWD:/src" -w /src -e RUST="$(rustc --version | cut -d' ' -f2)" ubuntu:22.04 bash -eo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST"
            . "$HOME/.cargo/env"
            git config --global --add safe.directory /src
            cargo test --release --locked
            cargo build --release --locked'
          sudo chown -R "$(id -u):$(id -g)" target

      - name: glibc check (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The program must keep starting on Ubuntu 22.04 and Debian 12 (glibc 2.35). It is
          # built in an ubuntu:22.04 container; failing here means that no longer holds.
          max=2.35
          need=$(objdump -T target/release/yagui | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -uV | tail -n 1) || true
          if [ -z "$need" ]; then echo "::error::No glibc versions found in target/release/yagui"; exit 1; fi
          echo "::notice::yagui needs glibc $need or newer (allowed: up to $max)"
          if [ "$(printf '%s\n%s\n' "$need" "$max" | sort -V | tail -n 1)" != "$max" ]; then
            echo "::error::yagui needs glibc $need, newer than $max: the .deb would require libc6 (>= $need) and not install on Ubuntu 22.04 / Debian 12. Symbols (w = weak):"
            objdump -T target/release/yagui | grep -F "(GLIBC_$need)" || true
            exit 1
          fi

      - name: Build (universal macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/yagui target/aarch64-apple-darwin/release/yagui target/x86_64-apple-darwin/release/yagui
          # Both halves must be there and start (the x86_64 one through Rosetta, if installed).
          lipo target/release/yagui -verify_arch arm64 x86_64
          ./target/release/yagui --version
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            arch -x86_64 ./target/release/yagui --version
          else
            echo "::warning::Rosetta is not available, the x86_64 part was not started"
          fi

      - name: Window test (macOS)
        if: runner.os == 'macOS'
        # Nowhere else does the workflow open YAGUI's window on a Mac: draw it once and keep the
        # picture. Not required for a release; a failure here only shows as a warning.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # --screenshot draws the window and exits; perl's alarm ends a window that never shows.
          perl -e 'alarm 120; exec @ARGV' ./target/release/yagui --screenshot "$RUNNER_TEMP/yagui-macos.png"
          size=$(stat -f%z "$RUNNER_TEMP/yagui-macos.png")
          echo "::notice::YAGUI's window was drawn on macOS ($size bytes)"
          test "$size" -gt 20000

      - name: Keep the window picture (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: yagui-macos-window
          path: ${{ runner.temp }}/yagui-macos.png
          retention-days: 3
          if-no-files-found: ignore

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/yagui.exe "dist/yagui-$VERSION-windows-x64.exe"
          cp target/release/yagui.exe "dist/YAGUI-Setup-$VERSION-windows-x64.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist "pkg/yagui-$VERSION-linux-x64"
          ./target/release/yagui --write-icon packaging/linux/yagui.png 256
          cp target/release/yagui README.md CHANGELOG.md packaging/linux/yagui.desktop packaging/linux/yagui.png "pkg/yagui-$VERSION-linux-x64/"
          tar -czf "dist/yagui-$VERSION-linux-x64.tar.gz" -C pkg "yagui-$VERSION-linux-x64"
          cargo install cargo-deb --locked
          cargo deb --no-build --output "dist/yagui_${VERSION}_amd64.deb"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist YAGUI.app/Contents/MacOS YAGUI.app/Contents/Resources yagui.iconset
          cp target/release/yagui YAGUI.app/Contents/MacOS/yagui
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > YAGUI.app/Contents/Info.plist
          for s in 16 32 128 256 512; do
            ./target/release/yagui --write-icon "yagui.iconset/icon_${s}x${s}.png" $s
            ./target/release/yagui --write-icon "yagui.iconset/icon_${s}x${s}@2x.png" $((s*2))
          done
          iconutil -c icns -o YAGUI.app/Contents/Resources/yagui.icns yagui.iconset
          # Ad hoc; one executable and nothing nested, so no --deep (deprecated for signing).
          codesign --force -s - YAGUI.app
          codesign --verify --strict --verbose=2 YAGUI.app
          mkdir dmg
          cp -R YAGUI.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil on the hosted macOS runners sometimes fails with "Resource busy"
          # (actions/runner-images#7522); try again with growing pauses.
          for i in 1 2 3 4 5; do
            sync
            hdiutil create -volname "YAGUI $VERSION" -srcfolder dmg -ov -format UDZO "dist/YAGUI-$VERSION-macos-universal.dmg" && break
            if [ "$i" = 5 ]; then exit 1; fi
            echo "hdiutil failed, trying again in $((i*15)) seconds"; sleep $((i*15))
          done
          tar -czf "dist/yagui-$VERSION-macos-universal.tar.gz" -C target/release yagui

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only ever add files to the draft: "Re-run failed jobs" does not run prepare again.
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error::Release $GITHUB_REF_NAME is already published; its files are not replaced. Tag a new version."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Keep as artifact (run by hand on a branch)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: yagui-${{ runner.os }}
          path: dist/*
          retention-days: 3

  publish:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check files, add checksums, publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The tag must still point to what this run built (it may have been moved meanwhile).
          # An annotated tag points to a tag object, which points to the commit ("commits/tags/<tag>"
          # answers 422 for those). GITHUB_SHA is the tagged commit; the tag object is accepted too.
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          tag_object=${ref#* }
          tag_commit=$tag_object
          if [ "${ref%% *}" = tag ]; then
            tag_commit=$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq .object.sha)
          fi
          if [ "$GITHUB_SHA" != "$tag_commit" ] && [ "$GITHUB_SHA" != "$tag_object" ]; then
            echo "::error::Tag $GITHUB_REF_NAME now points to $tag_commit, this run built $GITHUB_SHA. Nothing published; use the run for the new commit."
            exit 1
          fi
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error::Release $GITHUB_REF_NAME is already published and is not changed."
            exit 1
          fi
          files=(
            "YAGUI-Setup-$VERSION-windows-x64.exe"
            "yagui-$VERSION-windows-x64.exe"
            "yagui_${VERSION}_amd64.deb"
            "yagui-$VERSION-linux-x64.tar.gz"
            "YAGUI-$VERSION-macos-universal.dmg"
            "yagui-$VERSION-macos-universal.tar.gz"
          )
          mkdir files && cd files
          for f in "${files[@]}"; do
            gh release download "$GITHUB_REF_NAME" --pattern "$f" || { echo "::error::$f is missing in the release"; exit 1; }
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          # "Latest" only if no newer version is published (a late run for an older tag must not
          # take it over; the in-app updater reads the latest release).
          newest=$( { gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName'; echo "$GITHUB_REF_NAME"; } | sort -V | tail -n 1 )
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then latest=true; else latest=false; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$latest"
