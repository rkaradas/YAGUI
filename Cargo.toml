[package]
name = "yagui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
egui_extras = { version = "0.37" }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
