[package]
name = "yagui"
version = "1.1.0"
description = "YAGUI - Yet Another Git User Interface: a friendly desktop Git client"
repository = "https://github.com/rkaradas/YAGUI"
readme = "README.md"
edition = "2024"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
# Diff columns: character widths and grapheme clusters (both already used by egui).
unicode-segmentation = "1.13"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[package.metadata.deb]
name = "yagui"
maintainer = "YAGUI <https://github.com/rkaradas/YAGUI>"
extended-description = "A friendly desktop Git client: every Git command as a button or dialog, always showing what it runs."
section = "devel"
depends = "$auto, git, curl"
assets = [
    ["target/release/yagui", "usr/bin/", "755"],
    ["packaging/linux/yagui.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/yagui.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["README.md", "usr/share/doc/yagui/", "644"],
]

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
embed-resource = "3"

[profile.release]
opt-level = 2
